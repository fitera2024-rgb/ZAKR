[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hierarchy-account-transfer"
version = "1.0.0"
description = "Deterministic hierarchy-aware account transfer service"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "jinja2>=3.1,<4",
  "openpyxl>=3.1,<4",
  "pydantic>=2.9,<3",
  "python-multipart>=0.0.9",
  "pyyaml>=6,<7",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
test = ["httpx>=0.27", "pytest>=8", "ruff>=0.8"]

[project.scripts]
hat = "hierarchy_account_transfer.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/hierarchy_account_transfer"]

[tool.hatch.build.targets.wheel.force-include]
"src/hierarchy_account_transfer/web" = "hierarchy_account_transfer/web"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
